<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}小红书评论检测{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='xhs_ui.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">小红书评论检测</a>
      <nav>
        <a href="{{ url_for('index') }}">新检测</a>
        <a href="{{ url_for('history') }}">历史记录</a>
        <a href="{{ url_for('model_settings_page') }}">模型配置</a>
      </nav>
    </header>
    <main class="page">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="notice">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
