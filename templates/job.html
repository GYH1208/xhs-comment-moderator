{% extends "base.html" %}

{% block title %}检测中 - 小红书评论检测{% endblock %}

{% block content %}
<section class="panel" data-job-id="{{ job.id }}" data-status-url="{{ url_for('job_status', job_id=job.id) }}" data-result-url="{{ url_for('result', job_id=job.id) }}">
  <p class="eyebrow">检测任务</p>
  <h1>正在处理这个帖子</h1>
  <p class="job-url">{{ job.url }}</p>

  <div class="status-box status-{{ job.status }}" id="statusBox">
    <strong id="statusText">{{ job.message }}</strong>
    <span id="statusMeta">{{ job.updated_at }}</span>
  </div>

  <ol class="steps">
    <li data-step="opening">打开页面</li>
    <li data-step="waiting">等待确认</li>
    <li data-step="collecting">采集评论</li>
    <li data-step="reviewing">审核评论</li>
    <li data-step="done">生成结果</li>
  </ol>

  <form id="continueForm" action="{{ url_for('continue_job', job_id=job.id) }}" method="post" class="{% if job.status != 'waiting' %}hidden{% endif %}">
    <button type="submit">我已打开评论区，继续检测</button>
  </form>

  <div id="doneActions" class="actions {% if job.status != 'done' %}hidden{% endif %}">
    <a class="button-link" href="{{ url_for('result', job_id=job.id) }}">查看结果</a>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='xhs_ui.js') }}"></script>
{% endblock %}
